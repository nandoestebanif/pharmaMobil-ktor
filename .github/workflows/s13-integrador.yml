# Sesion 13 (rama feature/integrador-13): proyecto integrador. Emulador de Android en
# GitHub Actions con PharmaSoft real (perfil h2, base en archivo):
#   - :shared:testAndroidHostTest (SincronizacionTest y PermisosYAvisosTest incluidas)
#   - permiso de notificaciones en sus tres estados (.github/ci/s13-android.sh)
#   - sincronizacion: pendientes, fila fallida (409), fallo transitorio (503) y correccion
# Firebase no se prueba aqui: google-services.json no se sube al repositorio.
# Publica todo en la rama ci-evidencias-s13.
name: S13 Integrador

# Evidencias de la practica ya publicadas: desde la autonoma 13 se lanza solo a mano.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s13-integrador-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    # Ubuntu 26 (ubuntu-latest desde oct-2026) rompe herramientas del CI: se fija 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EVID: ${{ github.workspace }}/evidencias
      RAMA_EVIDENCIAS: ci-evidencias-s13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Habilitar KVM (aceleracion del emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preparar el entorno
        run: |
          mkdir -p "$EVID"
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          {
            echo "== sistema"; lsb_release -ds
            echo "== java"; java -version
            echo "== commit"; git log -1 --format='%H %s'
          } > "$EVID/entorno.txt" 2>&1 || true

      - name: Levantar PharmaSoft (perfil h2 con Flyway)
        run: |
          bash .github/ci/preparar-backend.sh
          bash .github/ci/backend.sh 60 archivo

      - name: Pruebas del modulo shared (commonTest en la JVM)
        continue-on-error: true
        run: |
          ./gradlew :shared:testAndroidHostTest --console=plain > "$EVID/pruebas-shared.log" 2>&1 || true
          mkdir -p "$EVID/pruebas-xml"
          cp shared/build/test-results/testAndroidHostTest/*.xml "$EVID/pruebas-xml/" 2>/dev/null || true
          python3 .github/ci/resumen_pruebas.py shared/build/test-results/testAndroidHostTest "$EVID/pruebas-s11.txt"
          echo "::notice title=Pruebas::$(head -2 "$EVID/pruebas-s11.txt" | tail -1)"

      - name: Compilar la app de Android (debug)
        run: |
          if ! ./gradlew :androidApp:assembleDebug > "$EVID/gradle-android.log" 2>&1; then
            ERR=$( (grep -E "^e: |What went wrong|^> " "$EVID/gradle-android.log" | head -25) | tr '\n' ' ' | cut -c1-3500)
            echo "::error title=Gradle (Android) fallo::$ERR"
            exit 1
          fi
          APK=$(find androidApp/build/outputs/apk/debug -name "*.apk" | head -1)
          test -n "$APK" || { echo "::error title=Sin APK::assembleDebug no genero el apk"; exit 1; }
          echo "APK=$PWD/$APK" >> "$GITHUB_ENV"

      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash > "$EVID/maestro-instalacion.log" 2>&1
          "$HOME/.maestro/bin/maestro" --version | tee -a "$EVID/maestro-instalacion.log"

      - name: Emulador (permisos y sincronizacion)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ci/s13-android.sh

      - name: Publicar en la rama ci-evidencias-s13
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/publicar.sh
