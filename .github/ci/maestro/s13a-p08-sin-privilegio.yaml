# Autonoma 13, paso 8: operacion sin privilegio. vendedor no tiene CATALOGO_ESCRIBIR; con
# «acciones: todas» (solo depuracion) la app le muestra Eliminar para provocar el 403.
# Se usa el primer producto de la lista para no depender del desplazamiento.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    arguments:
      acciones: todas
- runFlow:
    file: login.yaml
    env:
      USUARIO: vendedor
      CLAVE: Vendedor123
- tapOn: ".*Inventario, precios y stock.*"
- extendedWaitUntil:
    visible: ".*Amoxicilina 500mg.*"
    timeout: 60000
- tapOn: ".*Amoxicilina 500mg.*"
- extendedWaitUntil:
    visible: "Eliminar"
    timeout: 60000
- tapOn: "Eliminar"
- tapOn: "Sí, eliminar"
- extendedWaitUntil:
    visible: "No tienes permiso para realizar esta operación."
    timeout: 60000
- takeScreenshot: f08-403-sin-privilegio
- assertNotVisible: "Ingresar"
